---
- name: "frr | Deploy frr daemons"
  ansible.builtin.template:
    src: "daemons.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'frr_conf_dest') + '/daemons' }}"
    owner: "{{ lookup('ansible.builtin.vars', 'frr_user') }}"
    group: "{{ lookup('ansible.builtin.vars', 'frr_group') }}"
    mode: "0640"
  notify:
    - "Restart frr"
- name: "frr | Deploy frr scripts"
  ansible.builtin.template:
    src: "frr_script.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'frr_conf_dest') + '/scripts/' +
      frr_script['name'] + '.lua' }}"
    owner: "{{ lookup('ansible.builtin.vars', 'frr_user') }}"
    group: "{{ lookup('ansible.builtin.vars', 'frr_group') }}"
    mode: "0640"
  loop: "{{ lookup('ansible.builtin.vars', 'frr_scripts_list') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "frr_script"
    label: "{{ 'Deploy script: ' + lookup('ansible.builtin.vars',
      'frr_conf_dest') + '/scripts/' + frr_script['name'] + '.lua' }}"
  when:
    - "lookup('ansible.builtin.vars', 'frr_scripts_list',
      default='') not in ['', [], '[]', None]"
    - "script['name'] is defined"
    - "script['name'] not in ['', [], '[]', None]"
    - "script['data'] is defined"
    - "script['data'] not in ['', [], '[]', None]"
  notify:
    - "Restart frr"
- name: "frr | Deploy frr configuration"
  ansible.builtin.template:
    src: "frr.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'frr_conf_dest') + '/frr.conf' }}"
    owner: "{{ lookup('ansible.builtin.vars', 'frr_user') }}"
    group: "{{ lookup('ansible.builtin.vars', 'frr_group') }}"
    mode: "0640"
    validate: "vtysh -C -f %s"
  notify:
    - "Restart frr"
- name: "frr | Enable frr service"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 'frr_service') }}"
    enabled: "yes"
  when:
    - "lookup('ansible.builtin.vars', 'frr', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'frr') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'frr_enable', default='')) == 'true'"
  vars:
    frr_enable: "[] | map(&enable || 'false', @) | [0]"
