---
- name: "frr | Reload frr service"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 'frr_service') }}"
    state: "reloaded"
  listen: "Restart frr"
  when:
    - "lookup('ansible.builtin.vars', 'frr', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'frr') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'frr_restart', default='')) == 'true'"
  vars:
    frr_restart: "[] | map(&restart || 'false', @) | [0]"
